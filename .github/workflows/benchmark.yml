name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DSSZ_BUILD_BENCH=ON

      - name: Build benchmarks
        run: cmake --build build

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bench-results

          shopt -s nullglob
          executables=(build/bench_*)

          if [ ${#executables[@]} -eq 0 ]; then
            echo "No bench executables found"
            exit 0
          fi

          for exe in "${executables[@]}"; do
            # Skip non-executable files (e.g. .d or .o)
            [ -x "$exe" ] || continue
            name="$(basename "$exe")"
            echo "--- Running $name ---"
            "$exe" --output="build/bench-results/${name}.csv"
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/bench-results/
          if-no-files-found: ignore

      # TODO: Set these secrets in your GitHub repo settings:
      #   BENCHER_API_TOKEN  — from https://bencher.dev
      # TODO: Replace 'c-ssz' with your Bencher project slug.
      - name: Track with Bencher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: bencherdev/bencher@main
        with:
          command: |
            for csv in build/bench-results/*.csv; do
              bencher run \
                --project c-ssz \
                --token '${{ secrets.BENCHER_API_TOKEN }}' \
                --branch main \
                --testbed ubuntu-latest \
                --adapter json \
                --file "$csv"
            done
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}

      - name: Bencher PR comment
        if: github.event_name == 'pull_request'
        uses: bencherdev/bencher@main
        with:
          command: |
            for csv in build/bench-results/*.csv; do
              bencher run \
                --project c-ssz \
                --token '${{ secrets.BENCHER_API_TOKEN }}' \
                --branch '${{ github.head_ref }}' \
                --branch-start-point main \
                --testbed ubuntu-latest \
                --adapter json \
                --err \
                --github-actions '${{ secrets.GITHUB_TOKEN }}' \
                --file "$csv"
            done
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
