name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DSSZ_BUILD_BENCH=ON

      - name: Build benchmarks
        run: cmake --build build

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bench-results

          shopt -s nullglob
          executables=(build/bench_*)

          if [ ${#executables[@]} -eq 0 ]; then
            echo "No bench executables found"
            exit 0
          fi

          for exe in "${executables[@]}"; do
            # Skip non-executable files (e.g. .d or .o)
            [ -x "$exe" ] || continue
            name="$(basename "$exe")"
            echo "--- Running $name ---"
            "$exe" --output="build/bench-results/${name}.csv"
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/bench-results/
          if-no-files-found: ignore
