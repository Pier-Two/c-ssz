name: Frama-C Eva

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frama-c-eva:
    name: Frama-C Eva (Safety Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            opam \
            ninja-build \
            pkg-config \
            graphviz \
            libcairo2-dev \
            libgtk-3-dev \
            libgtksourceview-3.0-dev

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-frama-c-${{ hashFiles('.github/workflows/frama-c-eva.yml') }}
          restore-keys: |
            ${{ runner.os }}-opam-frama-c-

      - name: Initialize opam
        run: opam init -y --disable-sandboxing

      - name: Install Frama-C
        run: |
          eval "$(opam env)"
          opam install frama-c -y

      - name: Add opam bin to PATH
        run: echo "$HOME/.opam/default/bin" >> "$GITHUB_PATH"

      - name: Configure (CMake with compilation database)
        run: cmake -S . -B build -GNinja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Eva analysis
        continue-on-error: true
        run: |
          : > frama-c-eva-report.txt

          mapfile -t public_functions < <(
            awk '
              /^[[:space:]]*(ssz_error_t|bool|uint64_t)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(/ {
                name = $2
                sub(/\(.*/, "", name)
                print name
              }
            ' \
              include/ssz_serialize.h \
              include/ssz_deserialize.h \
              include/ssz_merkle.h \
              include/ssz_utils.h
          )

          echo "Found ${#public_functions[@]} public API functions" | tee -a frama-c-eva-report.txt

          failed_functions=()
          for func in "${public_functions[@]}"; do
            {
              echo
              echo "===== Eva analysis: ${func} ====="
            } | tee -a frama-c-eva-report.txt

            if ! frama-c -eva \
              -eva-precision 3 \
              -lib-entry \
              -main "${func}" \
              -compilation-db build/compile_commands.json \
              src/*.c \
              2>&1 | tee -a frama-c-eva-report.txt; then
              failed_functions+=("${func}")
              echo "Eva command failed for: ${func}" | tee -a frama-c-eva-report.txt
            fi
          done

          if [ "${#failed_functions[@]}" -gt 0 ]; then
            {
              echo
              echo "Eva failed for ${#failed_functions[@]} function(s): ${failed_functions[*]}"
            } | tee -a frama-c-eva-report.txt
            exit 1
          fi

      - name: Upload Eva report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frama-c-eva-report
          path: frama-c-eva-report.txt
