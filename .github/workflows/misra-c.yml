name: MISRA C Compliance

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  misra-c:
    name: MISRA C (cppcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cppcheck from source (for full MISRA addon support)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpcre3-dev
          cd /tmp
          git clone --depth 1 --branch 2.17.1 https://github.com/danmar/cppcheck.git cppcheck-src
          cd cppcheck-src
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHAVE_RULES=ON
          cmake --build build --parallel
          sudo cmake --install build
          cppcheck --version

      - name: Validate MISRA addon catches real violations
        run: |
          set -euo pipefail
          cat > /tmp/misra_test.c <<'TESTEOF'
          // Deliberate MISRA violation: octal constant (Rule 7.1)
          int x = 010;
          // Deliberate MISRA violation: use of banned function (Rule 21.6)
          #include <stdio.h>
          void f(void) { printf("hello"); }
          TESTEOF

          echo "Testing MISRA addon with known-bad code..."
          if cppcheck --addon=misra --enable=all --error-exitcode=0 /tmp/misra_test.c 2>&1 | grep -i "misra"; then
            echo "MISRA addon is working — detected violations in test file."
          else
            echo "ERROR: MISRA addon did not detect known violations!"
            exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run MISRA C analysis
        run: |
          set -euo pipefail
          cppcheck \
            --addon=misra \
            --enable=all \
            --error-exitcode=1 \
            --std=c11 \
            --project=build/compile_commands.json \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress='*:*external/*' \
            --suppress='*:*tests/*' \
            --suppress='*:*bench/*' \
            --suppress='*:*fuzz/*' \
            --suppress='misra-c2012-2.5:*include/*' \
            --suppress='misra-c2012-5.9' \
            -i external \
            -i tests \
            -i bench \
            -i fuzz \
            2>&1 | tee misra-c-report.txt

          # Count MISRA findings in project files only
          misra_count=$(grep -c 'misra-c' misra-c-report.txt || true)
          echo ""
          echo "=== MISRA C Summary ==="
          echo "MISRA findings in project code: ${misra_count}"
          if [ "$misra_count" -gt 0 ]; then
            echo "MISRA C violations found!"
            grep 'misra-c' misra-c-report.txt
            exit 1
          fi
          echo "No MISRA C violations in project code."

      - name: Upload MISRA C report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misra-c-report
          path: misra-c-report.txt
