name: ABI Check

on:
  push:
  pull_request:

jobs:
  abi-check:
    name: ABI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ABI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y abi-dumper abi-compliance-checker gcc universal-ctags

      - name: Configure and build static library with -fPIC
        run: |
          cmake -S . -B build -DCMAKE_C_FLAGS=-fPIC
          cmake --build build --target ssz

      - name: Create shared library from static archive
        run: |
          gcc -shared -o build/libssz.so \
            -Wl,--whole-archive build/libssz.a -Wl,--no-whole-archive -lm

      - name: Dump current ABI
        run: |
          abi-dumper build/libssz.so \
            -public-headers include \
            -o build/ssz-current.abi.dump \
            -lver current

      - name: Upload ABI dump
        uses: actions/upload-artifact@v4
        with:
          name: ssz-current-abi-dump
          path: build/ssz-current.abi.dump

      - name: Baseline comparison note
        run: |
          echo "Full ABI comparison will be added when a baseline release exists"
