name: Fuzzer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build and run fuzz harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fuzz

          shopt -s nullglob
          harnesses=(fuzz/fuzz_*.c)

          if [ ${#harnesses[@]} -eq 0 ]; then
            echo "No harnesses found matching fuzz/fuzz_*.c"
            exit 0
          fi

          for harness in "${harnesses[@]}"; do
            name="$(basename "${harness%.c}")"
            out="build/fuzz/${name}"

            clang -std=c99 -Wall -Wextra -O1 -g -fsanitize=fuzzer,address \
              -Iinclude -Ilib \
              "${harness}" src/*.c lib/mincrypt/sha256.c \
              -o "${out}"

            "${out}" -max_total_time=60 -artifact_prefix=build/fuzz/
          done

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzer-artifacts
          path: |
            build/fuzz/crash-*
            build/fuzz/leak-*
            build/fuzz/oom-*
            build/fuzz/timeout-*
          if-no-files-found: ignore
