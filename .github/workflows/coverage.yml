name: Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Configure
        run: cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='--coverage' -DCMAKE_EXE_LINKER_FLAGS='--coverage'

      - name: Build
        run: cmake --build build/coverage --parallel

      - name: Test
        run: ctest --test-dir build/coverage --output-on-failure

      - name: Generate coverage data
        run: lcov --capture --directory build/coverage --output-file build/coverage/coverage.info --ignore-errors mismatch

      - name: Filter coverage report
        run: lcov --remove build/coverage/coverage.info '/usr/*' '*/tests/*' '*/bench/*' '*/lib/*' '*/external/*' --output-file build/coverage/coverage-filtered.info --ignore-errors unused

      - name: Generate HTML report
        run: genhtml build/coverage/coverage-filtered.info --output-directory build/coverage/html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/html

      - name: Coverage summary
        run: lcov --summary build/coverage/coverage-filtered.info

  coverage-32bit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 32-bit toolchain and lcov
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libssl-dev:i386 lcov

      - name: Configure (32-bit with coverage)
        run: cmake -S . -B build/coverage-32 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-m32 --coverage' -DCMAKE_EXE_LINKER_FLAGS='-m32 --coverage' -DSSZ_USE_SYSTEM_CRYPTO=ON -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so

      - name: Build
        run: cmake --build build/coverage-32 --parallel

      - name: Test
        run: ctest --test-dir build/coverage-32 --output-on-failure

      - name: Generate coverage data
        run: lcov --capture --directory build/coverage-32 --output-file build/coverage-32/coverage.info --ignore-errors mismatch

      - name: Filter coverage report
        run: lcov --remove build/coverage-32/coverage.info '/usr/*' '*/tests/*' '*/bench/*' '*/lib/*' '*/external/*' --output-file build/coverage-32/coverage-filtered.info --ignore-errors unused

      - name: Generate HTML report
        run: genhtml build/coverage-32/coverage-filtered.info --output-directory build/coverage-32/html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-32bit
          path: build/coverage-32/html

      - name: Coverage summary
        run: lcov --summary build/coverage-32/coverage-filtered.info
