name: Spec Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-fixtures:
    name: Generate Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Generate consensus-spec fixtures
        run: |
          set -euo pipefail
          # Spec tests consume both ssz_generic and schema-driven ssz_static fixtures.
          rm -rf tests/fixtures tests/spec/generated/ssz_static_schema_generated.h tests/spec/generated/ssz_static_schema_generated.c
          cd external/consensus-specs
          uv sync --all-extras
          uv run python -m pysetup.generate_specs --all-forks
          uv run --extra generator --no-editable --reinstall-package=eth-consensus-specs \
            python -m tests.generators.main --output ../../tests/fixtures --runners ssz_generic
          uv run --extra generator --no-editable --reinstall-package=eth-consensus-specs \
            python -m tests.generators.main --output ../../tests/fixtures --runners ssz_static
          uv run python ../../tests/spec/generate_ssz_static_schema.py \
            --fixtures-root ../../tests/fixtures \
            --pyspec-root tests/core/pyspec \
            --output-header ../../tests/spec/generated/ssz_static_schema_generated.h \
            --output-source ../../tests/spec/generated/ssz_static_schema_generated.c

      - name: Upload fixtures artifact
        uses: actions/upload-artifact@v4
        with:
          name: consensus-spec-fixtures
          path: tests/fixtures/
          if-no-files-found: error

      - name: Upload generic fixtures artifact (Windows-friendly subset)
        uses: actions/upload-artifact@v4
        with:
          name: consensus-spec-fixtures-generic
          path: tests/fixtures/general/
          if-no-files-found: error

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: consensus-spec-schema
          path: |
            tests/spec/generated/ssz_static_schema_generated.h
            tests/spec/generated/ssz_static_schema_generated.c
          if-no-files-found: error

  linux-spec-test:
    name: Linux Spec (${{ matrix.compiler }}, ${{ matrix.arch }}-bit)
    runs-on: ubuntu-latest
    needs: [generate-fixtures]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        arch: ['64', '32']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download fixtures
        uses: actions/download-artifact@v4
        with:
          name: consensus-spec-fixtures
          path: tests/fixtures/

      - name: Download schema
        uses: actions/download-artifact@v4
        with:
          name: consensus-spec-schema
          path: tests/spec/generated/

      - name: Install toolchain packages
        run: |
          set -euo pipefail
          packages=()
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            packages+=(clang)
          fi
          if [ "${{ matrix.arch }}" = "32" ]; then
            sudo dpkg --add-architecture i386
            packages+=(gcc-multilib g++-multilib libssl-dev:i386)
          fi
          if [ ${#packages[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          build_dir="build/linux-${{ matrix.compiler }}-${{ matrix.arch }}"
          cmake_args=(-S . -B "$build_dir" -DCMAKE_BUILD_TYPE=Debug)
          if [ "${{ matrix.arch }}" = "32" ]; then
            cmake_args+=(
              "-DCMAKE_C_FLAGS=-m32"
              "-DCMAKE_EXE_LINKER_FLAGS=-m32"
              "-DSSZ_USE_SYSTEM_CRYPTO=ON"
              "-DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so"
            )
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: |
          set -euo pipefail
          cmake --build "build/linux-${{ matrix.compiler }}-${{ matrix.arch }}" --parallel

      - name: Test
        run: |
          set -euo pipefail
          ctest --test-dir "build/linux-${{ matrix.compiler }}-${{ matrix.arch }}" --output-on-failure

  macos-spec-test:
    name: macOS Spec
    runs-on: macos-latest
    needs: [generate-fixtures]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download fixtures
        uses: actions/download-artifact@v4
        with:
          name: consensus-spec-fixtures
          path: tests/fixtures/

      - name: Download schema
        uses: actions/download-artifact@v4
        with:
          name: consensus-spec-schema
          path: tests/spec/generated/

      - name: Configure
        run: cmake -S . -B build/macos-spec -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/macos-spec --parallel

      - name: Test
        run: ctest --test-dir build/macos-spec --output-on-failure

  windows-spec:
    name: Windows Spec
    runs-on: windows-latest
    needs: [generate-fixtures]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Windows runners repeatedly fail to download the full fixture artifact
      # (all forks × both presets × tens of thousands of ssz_static cases),
      # so we pull only the ssz_generic subset here. test_ssz_static is
      # auto-skipped by CMake when the schema file is absent, keeping
      # Windows coverage limited to the ssz_generic targets.
      - name: Download fixtures (generic only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactName = 'consensus-spec-fixtures-generic'
          $targetDir = Join-Path $PWD 'tests/fixtures/general'
          $maxAttempts = 8
          $delaySeconds = 10

          if (Test-Path $targetDir) {
            Remove-Item $targetDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $downloadDir = Join-Path $env:RUNNER_TEMP "$artifactName-$attempt"

            if (Test-Path $downloadDir) {
              Remove-Item $downloadDir -Recurse -Force
            }
            New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null

            Write-Host "Downloading $artifactName (attempt $attempt/$maxAttempts)..."
            & gh run download "${{ github.run_id }}" `
              --repo "$env:GITHUB_REPOSITORY" `
              --name $artifactName `
              --dir $downloadDir
            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              $artifactRoot = Join-Path $downloadDir $artifactName
              if (-not (Test-Path $artifactRoot)) {
                $artifactRoot = $downloadDir
              }

              Copy-Item -Path (Join-Path $artifactRoot '*') -Destination $targetDir -Recurse -Force
              Remove-Item $downloadDir -Recurse -Force
              Write-Host "Downloaded $artifactName to $targetDir"
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "Failed to download artifact '$artifactName' after $maxAttempts attempts."
            }

            $sleepSeconds = [Math]::Min($delaySeconds, 120)
            Write-Warning "gh run download failed with exit code $exitCode. Retrying in $sleepSeconds seconds..."
            Start-Sleep -Seconds $sleepSeconds
            $delaySeconds = [Math]::Min($delaySeconds * 2, 120)
          }

      - name: Configure
        run: cmake -S . -B build/windows-spec -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/windows-spec --config Debug

      - name: Test
        run: ctest --test-dir build/windows-spec -C Debug --output-on-failure

  sanitizer-suite:
    name: Sanitizer Suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [generate-fixtures]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            cc: clang
            sanitizers: address,undefined
            cmake_c_flags: ''
            asan_options: detect_leaks=0
            ubsan_options: halt_on_error=1:print_stacktrace=1
          - name: msan
            cc: clang
            sanitizers: memory
            cmake_c_flags: -fsanitize=memory -fno-omit-frame-pointer -fsanitize-memory-track-origins
            asan_options: ''
            ubsan_options: ''
          - name: tsan
            cc: clang
            sanitizers: thread
            cmake_c_flags: ''
            asan_options: ''
            ubsan_options: ''
          - name: valgrind
            cc: gcc
            sanitizers: ''
            cmake_c_flags: ''
            asan_options: ''
            ubsan_options: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download fixtures
        uses: actions/download-artifact@v4
        with:
          name: consensus-spec-fixtures
          path: tests/fixtures/

      - name: Download schema
        uses: actions/download-artifact@v4
        with:
          name: consensus-spec-schema
          path: tests/spec/generated/

      - name: Install runtime packages
        run: |
          set -euo pipefail
          packages=()
          if [ "${{ matrix.cc }}" = "clang" ]; then
            packages+=(clang)
          fi
          if [ "${{ matrix.name }}" = "valgrind" ]; then
            packages+=(valgrind)
          fi
          if [ ${#packages[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi

      - name: Prepare asan/ubsan ignorelist
        if: matrix.name == 'asan-ubsan'
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/asan-ubsan.ignore <<'EOF'
          src:*lib/mincrypt/sha256.c
          EOF

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          SSZ_SANITIZERS: ${{ matrix.sanitizers }}
          CMAKE_C_FLAGS_EXTRA: ${{ matrix.cmake_c_flags }}
        run: |
          set -euo pipefail
          cmake_args=(-S . -B build -DCMAKE_BUILD_TYPE=Debug)
          if [ -n "$SSZ_SANITIZERS" ]; then
            cmake_args+=("-DSSZ_SANITIZERS=$SSZ_SANITIZERS")
          fi
          if [ "${{ matrix.name }}" = "asan-ubsan" ]; then
            cmake_args+=("-DCMAKE_C_FLAGS=-fsanitize-ignorelist=$PWD/build/asan-ubsan.ignore")
          fi
          if [ -n "$CMAKE_C_FLAGS_EXTRA" ]; then
            cmake_args+=("-DCMAKE_C_FLAGS=$CMAKE_C_FLAGS_EXTRA")
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
        run: ctest --test-dir build --output-on-failure

      - name: Test under valgrind
        if: matrix.name == 'valgrind'
        run: valgrind --error-exitcode=1 --leak-check=full ctest --test-dir build --output-on-failure
