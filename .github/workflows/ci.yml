name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug

      - name: Build (non-Windows)
        if: runner.os != 'Windows'
        run: cmake --build build

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure -C Debug

      - name: Test (non-Windows)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

  build-and-test-32bit:
    name: build-and-test-32bit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libssl-dev:i386

      - name: Configure (32-bit)
        run: cmake -S . -B build -DCMAKE_C_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DSSZ_USE_SYSTEM_CRYPTO=ON -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure with sanitizers
        run: cmake -S . -B build -DSSZ_SANITIZERS=address,undefined -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: static-analysis (clang-tidy + cppcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Run clang-tidy
        run: |
          set -euo pipefail
          mapfile -t c_files < <(git ls-files 'src/*.c' 'include/*.h')
          if [ ${#c_files[@]} -eq 0 ]; then
            echo "No C source files found."
            exit 1
          fi

          clang-tidy -p build --warnings-as-errors='*' "${c_files[@]}"

      - name: Run cppcheck
        run: |
          set -euo pipefail
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c11 \
            --project=build/compile_commands.json \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -i external
