name: CBMC

on:
  push:
  pull_request:

jobs:
  cbmc:
    name: CBMC Harness Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y cbmc

      - name: Run CBMC harnesses
        run: |
          set -euo pipefail

          # Discover all CBMC harnesses expected to follow harness_*.c naming.
          mapfile -t harness_files < <(find verification/cbmc -maxdepth 1 -type f -name 'harness_*.c' | sort)
          if [ "${#harness_files[@]}" -eq 0 ]; then
            echo "Error: no CBMC harness files found in verification/cbmc (expected harness_*.c)."
            exit 1
          fi

          fail=0
          for harness in "${harness_files[@]}"; do
            entry_name="$(basename "${harness}" .c)"
            echo "===== CBMC: ${entry_name} ====="

            if ! cbmc "${harness}" src/*.c lib/mincrypt/sha256.c \
              -Iinclude -Ilib \
              --function "${entry_name}" \
              --unwind 8 \
              --unwinding-assertions; then
              echo "CBMC failed for: ${entry_name}"
              fail=1
            fi
          done

          # Fail the workflow if any harness verification fails.
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
