name: CBMC

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cbmc:
    name: CBMC Harness Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y cbmc

      - name: Run CBMC harnesses
        run: |
          set -euo pipefail

          # If CBMC harnesses are not present in this branch, skip gracefully.
          if [ ! -d cbmc ]; then
            echo "cbmc/ not found; skipping CBMC harness run."
            exit 0
          fi

          # Discover all CBMC harnesses expected to follow harness_*.c naming.
          mapfile -t harness_files < <(find cbmc -maxdepth 1 -type f -name 'harness_*.c' | sort)
          if [ "${#harness_files[@]}" -eq 0 ]; then
            echo "No CBMC harness files found in cbmc/ (expected harness_*.c); skipping."
            exit 0
          fi

          fail=0
          for harness in "${harness_files[@]}"; do
            entry_name="$(basename "${harness}" .c)"
            echo "===== CBMC: ${entry_name} ====="

            if ! cbmc "${harness}" $(cat "${harness%.c}.srcs") \
              -Iinclude \
              --function "${entry_name}" \
              --unwind 8 \
              --unwinding-assertions; then
              echo "CBMC failed for: ${entry_name}"
              fail=1
            fi
          done

          # Fail the workflow if any harness verification fails.
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
